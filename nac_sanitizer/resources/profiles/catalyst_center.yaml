name: catalyst_center
description: "Catalyst Center (DNAC) collector output"
version: "1.0"

packs:
  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..username"

  hostnames:
    tier: optional
    strategy: hostname_map
    paths:
      - "$..hostname"

  serial_numbers:
    tier: optional
    strategy: token
    paths:
      - "$..serialNumber"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..macAddress"
      - "$..apEthernetMacAddress"

  location_data:
    tier: optional
    strategy: token
    paths:
      - "$..siteNameHierarchy"
      - "$..groupNameHierarchy"

  credential_descriptions:
    tier: default
    strategy: token
    paths:
      - "$..cliCredential[*].description"
      - "$..snmpV3[*].description"
      - "$..netconfCredential[*].description"

  transit_network_names:
    tier: optional
    strategy: token
    paths:
      - "$.transit_network[*].data[*].name"

  authentication_descriptions:
    tier: optional
    strategy: token
    paths:
      - "$.authentication_policy_server[*].data[*].ciscoIseDtos[*].description"
      - "$.authentication_policy_server[*].data[*].ciscoIseDtos[*].fqdn"
      - "$.update_authentication_profile[*].data[*].preAuthAcl.description"

  image_names:
    tier: optional
    strategy: token
    paths:
      - "$.image[*].data[*].name"

  user_pii:
    tier: default
    strategy: token
    paths:
      - "$..users[*].email"
      - "$..users[*].firstName"
      - "$..users[*].lastName"
