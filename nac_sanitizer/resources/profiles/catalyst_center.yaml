name: catalyst_center
description: "Catalyst Center (DNAC) collector output"
version: "1.0"

packs:
  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..username"

  hostnames:
    tier: optional
    strategy: hostname_map
    paths:
      - "$..hostname"

  serial_numbers:
    tier: optional
    strategy: token
    paths:
      - "$..serialNumber"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..macAddress"
      - "$..apEthernetMacAddress"

  location_data:
    tier: optional
    strategy: token
    paths:
      - "$..siteNameHierarchy"
      - "$..groupNameHierarchy"

  virtual_network_names:
    tier: optional
    strategy: token
    paths:
      - "$..virtualNetworkName"
      - "$..associatedLayer3VirtualNetworkName"

  vlan_names:
    tier: optional
    strategy: token
    paths:
      - "$..vlanName"
      - "$..dataVlanName"

  ip_pool_names:
    tier: optional
    strategy: token
    paths:
      - "$..ipPoolName"
      - "$.ip_pools[*].data[*].name"

  security_group_names:
    tier: optional
    strategy: token
    paths:
      - "$..securityGroupName"
      - "$..scalableGroupNames[*]"
