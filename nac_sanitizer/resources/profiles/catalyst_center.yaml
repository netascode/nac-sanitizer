name: catalyst_center
description: "Catalyst Center (DNAC) collector output"
version: "1.0"

packs:
  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..username"

  hostnames:
    tier: optional
    strategy: hostname_map
    paths:
      - "$..hostname"

  serial_numbers:
    tier: optional
    strategy: token
    paths:
      - "$..serialNumber"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..macAddress"
      - "$..apEthernetMacAddress"

  location_data:
    tier: optional
    strategy: token
    paths:
      - "$..siteNameHierarchy"
      - "$..groupNameHierarchy"

  site_names:
    tier: optional
    strategy: token
    paths:
      - "$.area[*].data[*].name"
      - "$.building[*].data[*].name"
      - "$.site[*].data[*].name"
      - "$..nameHierarchy"
      - "$..siteHierarchy"
      - "$..siteNames[*]"
      - "$.ip_pool_reservation[*].data[*].groupName"

  physical_addresses:
    tier: optional
    strategy: token
    paths:
      - "$.area[*].data[*].additionalInfo[*].attributes.address"
      - "$.area[*].data[*].additionalInfo[*].attributes.country"
      - "$.building[*].data[*].additionalInfo[*].attributes.address"
      - "$.building[*].data[*].additionalInfo[*].attributes.country"
      - "$.site[*].data[*].address"
      - "$.site[*].data[*].country"

  domain_names:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..domainName"
