name: catalyst_center
description: "Catalyst Center (DNAC) collector output"
version: "1.0"

packs:
  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..username"

  hostnames:
    tier: optional
    strategy: hostname_map
    paths:
      - "$..hostname"

  serial_numbers:
    tier: optional
    strategy: token
    paths:
      - "$..serialNumber"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..macAddress"
      - "$..apEthernetMacAddress"

  location_data:
    tier: optional
    strategy: token
    paths:
      - "$..siteNameHierarchy"
      - "$..groupNameHierarchy"

  template_content:
    tier: default
    strategy: token
    paths:
      - "$..templateContent"

  template_authors:
    tier: optional
    strategy: token
    paths:
      - "$.template[*].data[*].author"
      - "$..versionsInfo[*].author"

  template_metadata:
    tier: optional
    strategy: token
    paths:
      - "$.template[*].data[*].name"
      - "$.template[*].data[*].description"
      - "$.template[*].data[*].tags[*].name"
      - "$.extended_templates[*].data[*].data[*].name"
      - "$.extended_templates[*].data[*].data[*].description"
      - "$.extended_templates[*].data[*].data[*].versionsInfo[*].description"
      - "$.extended_templates[*].data[*].data[*].tags[*].name"
      - "$.template_version[*].data[*].data[*].name"
      - "$.template_version[*].data[*].data[*].versionsInfo[*].description"
      - "$.template_version[*].data[*].data[*].tags[*].name"
      - "$.project[*].data[*].name"
      - "$.project[*].data[*].description"
      - "$.project[*].data[*].templates[*].name"
