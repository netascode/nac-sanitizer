name: catalyst_center
description: "Catalyst Center (DNAC) collector output"
version: "1.0"

packs:
  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..username"

  hostnames:
    tier: optional
    strategy: hostname_map
    paths:
      - "$..hostname"

  serial_numbers:
    tier: optional
    strategy: token
    paths:
      - "$..serialNumber"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..macAddress"
      - "$..apEthernetMacAddress"

  location_data:
    tier: optional
    strategy: token
    paths:
      - "$..siteNameHierarchy"
      - "$..groupNameHierarchy"

  ip_pool_context:
    tier: optional
    strategy: token
    paths:
      - "$.ip_pool[*].data[*].ipPoolName"
      - "$.ip_pool_reservation[*].data[*].groupName"
      - "$.ip_pool_reservation[*].data[*].siteHierarchy"
      - "$.ip_pool_reservation[*].data[*].ipPools[*].ipPoolName"
      - "$.ip_pools[*].data[*].name"
      - "$.lan_automation[*].data[*].ipPools[*].ipPoolName"
