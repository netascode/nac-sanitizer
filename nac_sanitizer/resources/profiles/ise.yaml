name: ise
description: "ISE (Identity Services Engine) collector output"
version: "1.0"

packs:
  credentials:
    tier: default
    strategy: token
    paths:
      - "$..radiusSharedSecret"
      - "$..sharedSecret"
      - "$..previousSharedSecret"
      - "$..password"
      - "$..enablePassword"

  snmp_communities:
    tier: default
    strategy: token
    paths:
      - "$..roCommunity"
      - "$..rwCommunity"


  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..userName"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..mac"

  domains:
    tier: optional
    strategy: token
    paths:
      - "$..domain"

  tacacs_profiles:
    tier: optional
    strategy: token
    paths:
      - "$.tacacs_profile[*].data.name"
      - "$.tacacs_profile[*].data.description"
      - "$.tacacs_profile[*].data.sessionAttributes.sessionAttributeList[*].name"
      - "$.tacacs_profile[*].data.sessionAttributes.sessionAttributeList[*].value"
      - "$.tacacs_command_set[*].data.name"
      - "$.tacacs_command_set[*].data.description"

  repository_config:
    tier: optional
    strategy: token
    paths:
      - "$.repository[*].data.name"
      - "$.repository[*].data.path"

  policy_names:
    tier: optional
    strategy: token
    paths:
      - "$.allowed_protocols[*].data.name"
      - "$.allowed_protocols_tacacs[*].data.name"

  downloadable_acl_names:
    tier: optional
    strategy: token
    paths:
      - "$.downloadable_acl[*].data.name"

  identity_sources:
    tier: optional
    strategy: token
    paths:
      - "$.certificate_authentication_profile[*].data.name"
      - "$..externalIdentityStoreName"

  license_tier_names:
    tier: optional
    strategy: token
    paths:
      - "$.license_tier_state[*].data[*].name"
