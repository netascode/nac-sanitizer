name: ise
description: "ISE (Identity Services Engine) collector output"
version: "1.0"

packs:
  credentials:
    tier: default
    strategy: token
    paths:
      - "$..radiusSharedSecret"
      - "$..sharedSecret"
      - "$..previousSharedSecret"
      - "$..password"
      - "$..enablePassword"

  snmp_communities:
    tier: default
    strategy: token
    paths:
      - "$..roCommunity"
      - "$..rwCommunity"


  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..userName"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..mac"

  domains:
    tier: optional
    strategy: token
    paths:
      - "$..domain"

  tacacs_profiles:
    tier: optional
    strategy: token
    paths:
      - "$.tacacs_profile[*].data.name"
      - "$.tacacs_profile[*].data.description"
      - "$.tacacs_profile[*].data.sessionAttributes.sessionAttributeList[*].name"
      - "$.tacacs_profile[*].data.sessionAttributes.sessionAttributeList[*].value"
      - "$.tacacs_command_set[*].data.name"
      - "$.tacacs_command_set[*].data.description"

  device_trustsec_credentials:
    tier: default
    strategy: token
    paths:
      - "$..deviceConfigurationDeployment.enableModePassword"
      - "$..deviceConfigurationDeployment.execModePassword"
      - "$..deviceConfigurationDeployment.execModeUsername"

  network_device_names:
    tier: optional
    strategy: hostname_map
    paths:
      - "$.network_device[*].data.name"
      - "$..sgaNotificationAndUpdates.coaSourceHost"

  network_device_groups:
    tier: optional
    strategy: token
    paths:
      - "$.network_device[*].data.NetworkDeviceGroupList[*]"
      - "$.network_device_group[*].data.name"
      - "$.network_device_group[*].data.description"
