name: ise
description: "ISE (Identity Services Engine) collector output"
version: "1.0"

packs:
  credentials:
    tier: default
    strategy: token
    paths:
      - "$..radiusSharedSecret"
      - "$..sharedSecret"
      - "$..previousSharedSecret"
      - "$..password"
      - "$..enablePassword"

  snmp_communities:
    tier: default
    strategy: token
    paths:
      - "$..roCommunity"
      - "$..rwCommunity"


  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..userName"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..mac"

  domains:
    tier: optional
    strategy: token
    paths:
      - "$..domain"

  tacacs_profiles:
    tier: optional
    strategy: token
    paths:
      - "$.tacacs_profile[*].data.name"
      - "$.tacacs_profile[*].data.description"
      - "$.tacacs_profile[*].data.sessionAttributes.sessionAttributeList[*].name"
      - "$.tacacs_profile[*].data.sessionAttributes.sessionAttributeList[*].value"
      - "$.tacacs_command_set[*].data.name"
      - "$.tacacs_command_set[*].data.description"

  repository_config:
    tier: optional
    strategy: token
    paths:
      - "$.repository[*].data.name"
      - "$.repository[*].data.path"

  policy_names:
    tier: optional
    strategy: token
    paths:
      - "$.allowed_protocols[*].data.name"
      - "$.allowed_protocols_tacacs[*].data.name"

  downloadable_acl_names:
    tier: optional
    strategy: token
    paths:
      - "$.downloadable_acl[*].data.name"

  identity_sources:
    tier: optional
    strategy: token
    paths:
      - "$.certificate_authentication_profile[*].data.name"
      - "$..externalIdentityStoreName"

  license_tier_names:
    tier: optional
    strategy: token
    paths:
      - "$.license_tier_state[*].data[*].name"

  security_groups:
    tier: optional
    strategy: token
    paths:
      - "$.trustsec_security_group[*].data.name"
      - "$.trustsec_security_group[*].data.description"
      - "$.trustsec_security_group_acl[*].data.name"
      - "$.trustsec_egress_matrix_cell[*].data.name"
      - "$.trustsec_egress_matrix_cell_default[*].data.name"

  sxp_config:
    tier: optional
    strategy: token
    paths:
      - "$.sxp_domain_filter[*].data.vn"
      - "$.sxp_domain_filter[*].data.domains"

  device_trustsec_credentials:
    tier: default
    strategy: token
    paths:
      - "$..deviceConfigurationDeployment.enableModePassword"
      - "$..deviceConfigurationDeployment.execModePassword"
      - "$..deviceConfigurationDeployment.execModeUsername"

  network_device_names:
    tier: optional
    strategy: hostname_map
    paths:
      - "$.network_device[*].data.name"
      - "$..sgaNotificationAndUpdates.coaSourceHost"

  network_device_groups:
    tier: optional
    strategy: token
    paths:
      - "$.network_device[*].data.NetworkDeviceGroupList[*]"
      - "$.network_device_group[*].data.name"
      - "$.network_device_group[*].data.description"

  authorization_profiles:
    tier: optional
    strategy: token
    paths:
      - "$.authorization_profile[*].data.name"
      - "$.authorization_profile[*].data.description"
      - "$.authorization_profile[*].data.vlan.nameID"
      - "$.authorization_profile[*].data.advancedAttributes[*].rightHandSideAttribueValue.value"

  identity_source_sequences:
    tier: optional
    strategy: token
    paths:
      - "$.identity_source_sequence[*].data.name"
      - "$.identity_source_sequence[*].data.description"
      - "$.identity_source_sequence[*].data.idSeqItem[*].idstore"

  active_directory_groups:
    tier: optional
    strategy: token
    paths:
      - "$.active_directory_join_point[*].data.name"
      - "$.active_directory_join_point[*].data.adgroups.groups[*].name"

  personal_info:
    tier: default
    strategy: token
    paths:
      - "$..advancedSettings.firstName"
      - "$..advancedSettings.lastName"

  user_personal_info:
    tier: default
    strategy: token
    paths:
      - "$.internal_user[*].data.name"
      - "$.internal_user[*].data.firstName"
      - "$.internal_user[*].data.lastName"
      - "$.internal_user[*].data.email"

  user_identity_groups:
    tier: optional
    strategy: token
    paths:
      - "$.internal_user[*].data.description"
      - "$.user_identity_group[*].data.name"
      - "$.user_identity_group[*].data.description"

  endpoint_identities:
    tier: optional
    strategy: preserve_format
    paths:
      - "$.endpoint[*].data.name"
      - "$.endpoint_identity_group[*].data.name"
      - "$.endpoint_identity_group[*].data.description"

  endpoint_custom_pii:
    tier: default
    strategy: token
    paths:
      - "$..customAttributes.customAttributes.UserEmail"

  device_admin_policy_names:
    tier: optional
    strategy: token
    paths:
      - "$.device_admin_policy_set[*].data.name"
      - "$.device_admin_policy_set_update_ranks[*].data.name"
      - "$.device_admin_condition[*].data.name"
      - "$..rule.name"

  device_admin_condition_values:
    tier: optional
    strategy: token
    paths:
      - "$..condition.attributeValue"
      - "$..condition.attributeName"
      - "$..condition.dictionaryName"
      - "$..condition.name"
      - "$..condition.children[*].attributeValue"
      - "$..condition.children[*].attributeName"
      - "$..condition.children[*].dictionaryName"
      - "$..condition.children[*].name"

  device_admin_authz_refs:
    tier: optional
    strategy: token
    paths:
      - "$..device_admin_authorization_rule[*].data.profile"
      - "$..device_admin_authorization_rule_update_ranks[*].data.profile"
      - "$..device_admin_authorization_rule[*].data.commands[*]"
      - "$..device_admin_authorization_rule_update_ranks[*].data.commands[*]"
