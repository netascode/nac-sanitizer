name: ise
description: "ISE (Identity Services Engine) collector output"
version: "1.0"

packs:
  credentials:
    tier: default
    strategy: token
    paths:
      - "$..radiusSharedSecret"
      - "$..sharedSecret"
      - "$..previousSharedSecret"
      - "$..password"
      - "$..enablePassword"

  snmp_communities:
    tier: default
    strategy: token
    paths:
      - "$..roCommunity"
      - "$..rwCommunity"


  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..userName"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..mac"

  domains:
    tier: optional
    strategy: token
    paths:
      - "$..domain"

  security_groups:
    tier: optional
    strategy: token
    paths:
      - "$.trustsec_security_group[*].data.name"
      - "$.trustsec_security_group[*].data.description"
      - "$.trustsec_security_group_acl[*].data.name"
      - "$.trustsec_egress_matrix_cell[*].data.name"
      - "$.trustsec_egress_matrix_cell_default[*].data.name"

  sxp_config:
    tier: optional
    strategy: token
    paths:
      - "$.sxp_domain_filter[*].data.vn"
      - "$.sxp_domain_filter[*].data.domains"
