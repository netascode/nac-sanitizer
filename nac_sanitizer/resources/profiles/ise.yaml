name: ise
description: "ISE (Identity Services Engine) collector output"
version: "1.0"

packs:
  credentials:
    tier: default
    strategy: token
    paths:
      - "$..radiusSharedSecret"
      - "$..sharedSecret"
      - "$..previousSharedSecret"
      - "$..password"
      - "$..enablePassword"

  snmp_communities:
    tier: default
    strategy: token
    paths:
      - "$..roCommunity"
      - "$..rwCommunity"


  usernames:
    tier: optional
    strategy: token
    paths:
      - "$..userName"

  mac_addresses:
    tier: optional
    strategy: preserve_format
    paths:
      - "$..mac"

  domains:
    tier: optional
    strategy: token
    paths:
      - "$..domain"

  tacacs_profiles:
    tier: optional
    strategy: token
    paths:
      - "$.tacacs_profile[*].data.name"
      - "$.tacacs_profile[*].data.description"
      - "$.tacacs_profile[*].data.sessionAttributes.sessionAttributeList[*].name"
      - "$.tacacs_profile[*].data.sessionAttributes.sessionAttributeList[*].value"
      - "$.tacacs_command_set[*].data.name"
      - "$.tacacs_command_set[*].data.description"

  authorization_profiles:
    tier: optional
    strategy: token
    paths:
      - "$.authorization_profile[*].data.name"
      - "$.authorization_profile[*].data.description"
      - "$.authorization_profile[*].data.vlan.nameID"
      - "$.authorization_profile[*].data.advancedAttributes[*].rightHandSideAttribueValue.value"
