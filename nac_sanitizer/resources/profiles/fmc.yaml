name: fmc
description: "FMC (Firewall Management Center) collector output"
version: "1.0"

detect:
  filenames:
    - fmc.json
    - cdfmc.json
  keys:
    - access_control_policy
    - domains
    - ftd_nat_policy
    - ftd_platform_settings
    - host
    - network_group
    - port
    - port_group
    - range
    - security_zone
    - server_version
    - smart_license
    - fqdn
    - url
    - vpn_s2s

packs:
  usernames:
    tier: default
    strategy: token
    paths:
      - "$..metadata.lastUser.name"

  object_names:
    tier: optional
    strategy: token
    paths:
      - "$..data.name"

  descriptions:
    tier: optional
    strategy: token
    paths:
      - "$..data.description"

  fqdns:
    tier: optional
    strategy: token
    paths:
      - "$.fqdn[*].data.value"
      - "$.fqdns[*].data.value"

  device_names:
    tier: optional
    strategy: hostname_map
    paths:
      - "$.device[*].data.name"
      - "$.device[*].data.hostName"
