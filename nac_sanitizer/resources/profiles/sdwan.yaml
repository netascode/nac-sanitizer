name: sdwan
description: "SD-WAN (vManage) collector output"
version: "1.0"

packs:
  credentials:
    tier: default
    strategy: token
    paths:
      - "$..vipPasskey"


  hostnames:
    tier: optional
    strategy: hostname_map
    paths:
      - "$..host-name"
      - "$..csv-host-name"
      - "$..host_name"
      - '$.."//system/host-name"'

  serial_numbers:
    tier: optional
    strategy: token
    paths:
      - "$..board-serial"
      - "$..serialNumber"
      - "$..chasisNumber"  # genuine vManage API misspelling, not a typo
      - "$..uuid"
      - "$..csv-deviceId"

  location_data:
    tier: optional
    strategy: token
    paths:
      - "$..latitude"
      - "$..longitude"
      - "$..site-name"
      - "$..site-id"
      - '$.."//system/gps-location/latitude"'
      - '$.."//system/gps-location/longitude"'
      - '$.."//system/site-id"'
      - "$..system_latitude"
      - "$..system_longitude"

  # configuration_group_devices[*].data.variables stores device-specific
  # values as generic {name, value} pairs. The generic "value" key can't be
  # matched by name alone, so these paths use jsonpath_ng filter expressions
  # to conditionally match "value" based on its sibling "name" field.
  # See: https://github.com/netascode/nac-sanitizer/issues/167
  configuration_group_variable_values:
    tier: optional
    strategy: token
    paths:
      - '$.configuration_group_devices[*].data.variables[?(@.name == "host_name")].value'
      - '$.configuration_group_devices[*].data.variables[?(@.name == "site_id")].value'
      - '$.configuration_group_devices[*].data.variables[?(@.name =~ ".*_ckt_id$")].value'

  # See: https://github.com/netascode/nac-sanitizer/issues/161
  url_filter_patterns:
    tier: default
    strategy: token
    paths:
      - "$.allow_url_list_policy_object[*].data.entries[*].pattern"
      - "$.block_url_list_policy_object[*].data.entries[*].pattern"
      - "$.tls_ssl_profile_policy_definition[*].data.definition.filteredUrlBlackList[*].entries[*].pattern"
      - "$.tls_ssl_profile_policy_definition[*].data.definition.filteredUrlBlackList[*].entries[*].name"
      - "$.tls_ssl_profile_policy_definition[*].data.definition.filteredUrlWhiteList[*].entries[*].pattern"
      - "$.tls_ssl_profile_policy_definition[*].data.definition.filteredUrlWhiteList[*].entries[*].name"
      # policy_object_feature_profile children (feature profile parcels) may
      # also contain URL list entries. Not reproducible in lab data (children
      # array was empty in available samples) - added as a safety net based
      # on the reported field-naming convention.
      - "$.policy_object_feature_profile[*].children[*].data.payload.data.entries[*].pattern"

  configuration_group_names:
    tier: optional
    strategy: token
    paths:
      - "$.configuration_group[*].data.description"

  user_identity:
    tier: default
    strategy: token
    paths:
      - "$..owner"
      - "$..createdBy"
      - "$..lastUpdatedBy"

  organization_names:
    tier: default
    strategy: token
    paths:
      - "$..sp-org-name"
      - "$..tenant-org-name"

  vpn_service_names:
    tier: optional
    strategy: token
    paths:
      - "$..payload.name"
      - "$..payload.description"
      - "$..payload.data.name.value"
      - "$..payload.data.description.value"
      - "$..payload.data.entries[*].vpn.value"

  template_definition_values:
    tier: optional
    strategy: token
    paths:
      - "$..templateDefinition.name.vipValue"
      - "$..editedTemplateDefinition.name.vipValue"
      - "$..templateDefinition.description.vipValue"
      - "$..editedTemplateDefinition.description.vipValue"
      - "$..templateDefinition.pim.rp-addr.vipValue[*].access-list.vipValue"
      - "$..editedTemplateDefinition.pim.rp-addr.vipValue[*].access-list.vipValue"

  policy_definition_names:
    tier: optional
    strategy: token
    paths:
      - "$.custom_control_topology_policy_definition[*].data.name"
      - "$.traffic_data_policy_definition[*].data.name"
      - "$.traffic_data_policy_definition[*].data.description"
      - "$.zone_based_firewall_policy_definition[*].data.name"
      - "$.zone_based_firewall_policy_definition[*].data.description"
      - "$.zone_list_policy_object[*].data.name"
      - "$..sequences[*].sequenceName"

  template_names:
    tier: optional
    strategy: token
    paths:
      - "$..templateName"
      - "$..templateDescription"
      - "$..profileName"

  cli_template_configs:
    tier: optional
    strategy: token
    paths:
      - "$..templateConfiguration"
      - "$..templateConfigurationEdited"

  policy_profile_descriptions:
    tier: optional
    strategy: token
    paths:
      - "$.policy_object_feature_profile[*].data.description"
      - "$.policy_object_feature_profile_parcels[*].data.description"

  policy_object_names:
    tier: optional
    strategy: token
    paths:
      - "$.vpn_list_policy_object[*].data.name"
      - "$.site_list_policy_object[*].data.name"
      - "$.ipv4_prefix_list_policy_object[*].data.name"
      - "$.data_ipv4_prefix_list_policy_object[*].data.name"
      - "$.preferred_color_group_policy_object[*].data.name"
      - "$.standard_community_list_policy_object[*].data.name"
      - "$.vpn_list_policy_object[*].endpoint"
      - "$.site_list_policy_object[*].endpoint"
      - "$.ipv4_prefix_list_policy_object[*].endpoint"
      - "$.data_ipv4_prefix_list_policy_object[*].endpoint"
      - "$.preferred_color_group_policy_object[*].endpoint"
      - "$.standard_community_list_policy_object[*].endpoint"
