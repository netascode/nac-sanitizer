name: sdwan
description: "SD-WAN (vManage) collector output"
version: "1.0"

packs:
  credentials:
    tier: default
    strategy: token
    paths:
      - "$..vipPasskey"


  hostnames:
    tier: optional
    strategy: hostname_map
    paths:
      - "$..host-name"

  serial_numbers:
    tier: optional
    strategy: token
    paths:
      - "$..board-serial"
      - "$..serialNumber"
      - "$..chasisNumber"  # genuine vManage API misspelling, not a typo
      - "$..uuid"

  location_data:
    tier: optional
    strategy: token
    paths:
      - "$..latitude"
      - "$..longitude"
      - "$..site-name"
      - "$..site-id"

  policy_object_names:
    tier: optional
    strategy: token
    paths:
      - "$.vpn_list_policy_object[*].data.name"
      - "$.site_list_policy_object[*].data.name"
      - "$.ipv4_prefix_list_policy_object[*].data.name"
      - "$.data_ipv4_prefix_list_policy_object[*].data.name"
      - "$.preferred_color_group_policy_object[*].data.name"
      - "$.standard_community_list_policy_object[*].data.name"
      - "$.vpn_list_policy_object[*].endpoint"
      - "$.site_list_policy_object[*].endpoint"
      - "$.ipv4_prefix_list_policy_object[*].endpoint"
      - "$.data_ipv4_prefix_list_policy_object[*].endpoint"
      - "$.preferred_color_group_policy_object[*].endpoint"
      - "$.standard_community_list_policy_object[*].endpoint"
