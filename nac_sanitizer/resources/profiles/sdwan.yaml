name: sdwan
description: "SD-WAN (vManage) collector output"
version: "1.0"

packs:
  credentials:
    tier: default
    strategy: token
    paths:
      - "$..vipPasskey"


  hostnames:
    tier: optional
    strategy: hostname_map
    paths:
      - "$..host-name"

  serial_numbers:
    tier: optional
    strategy: token
    paths:
      - "$..board-serial"
      - "$..serialNumber"
      - "$..chasisNumber"  # genuine vManage API misspelling, not a typo
      - "$..uuid"

  location_data:
    tier: optional
    strategy: token
    paths:
      - "$..latitude"
      - "$..longitude"
      - "$..site-name"
      - "$..site-id"

  url_filter_patterns:
    tier: default
    strategy: token
    paths:
      - "$.allow_url_list_policy_object[*].data.entries[*].pattern"
      - "$.block_url_list_policy_object[*].data.entries[*].pattern"

  configuration_group_names:
    tier: optional
    strategy: token
    paths:
      - "$.configuration_group[*].data.description"

  user_identity:
    tier: default
    strategy: token
    paths:
      - "$..owner"
      - "$..createdBy"
      - "$..lastUpdatedBy"

  organization_names:
    tier: default
    strategy: token
    paths:
      - "$..sp-org-name"
      - "$..tenant-org-name"

  vpn_service_names:
    tier: optional
    strategy: token
    paths:
      - "$..payload.name"
      - "$..payload.description"
      - "$..payload.data.name.value"
      - "$..payload.data.description.value"
      - "$..payload.data.entries[*].vpn.value"
